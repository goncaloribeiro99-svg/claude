<title>Gonçalo Ribeiro — Candidatura</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23131210'/%3E%3Ctext x='16' y='23' font-family='Arial Black,Arial' font-size='17' font-weight='900' text-anchor='middle' fill='%23D2A24E'%3EG%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,300..600&display=swap">

<style>
/* =======================================================================
   Gonçalo Ribeiro — CV one-scroller
   Linguagem visual: ficha técnica. Cada secção é uma "chapa" numerada.
   O acento (--accent / --accent-hi) é injetado por empresa a partir de
   data.js; tudo o resto é comum às quatro versões.
   ======================================================================= */
/* ===================== TOKENS ===================== */
:root{
  /* claro — papel de projeto */
  --ground:#E9E3D6;
  --ground-2:#F1ECE1;
  --ground-3:#DED7C7;
  --ink:#16140F;
  --ink-2:#585141;
  --ink-3:#8C8472;
  --accent:#8A5A12;
  --accent-hi:#B07A22;
  --line:rgba(22,20,15,.16);
  --line-2:rgba(22,20,15,.07);
  --dot:rgba(22,20,15,.30);
  --shadow:0 24px 60px rgba(22,20,15,.13);

  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --gut:clamp(20px,5vw,64px);
  --rail:104px;
  --maxw:1240px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#131210;
    --ground-2:#1A1815;
    --ground-3:#221F1B;
    --ink:#F1ECE1;
    --ink-2:#A79F8D;
    --ink-3:#6E6757;
    --accent:#D2A24E;
    --accent-hi:#EFC276;
    --line:rgba(241,236,225,.14);
    --line-2:rgba(241,236,225,.06);
    --dot:rgba(241,236,225,.26);
    --shadow:0 28px 70px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --ground:#131210;
  --ground-2:#1A1815;
  --ground-3:#221F1B;
  --ink:#F1ECE1;
  --ink-2:#A79F8D;
  --ink-3:#6E6757;
  --accent:#D2A24E;
  --accent-hi:#EFC276;
  --line:rgba(241,236,225,.14);
  --line-2:rgba(241,236,225,.06);
  --dot:rgba(241,236,225,.26);
  --shadow:0 28px 70px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--serif);font-size:17.5px;line-height:1.62;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:800;
  font-variation-settings:"wdth" 118;text-transform:uppercase;
  letter-spacing:-.012em;line-height:.92;text-wrap:balance}
p{margin:0}
a{color:inherit}
img{display:block;max-width:100%}
::selection{background:var(--accent);color:var(--ground)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

/* ===================== ESTRUTURA ===================== */
.shell{max-width:var(--maxw);margin:0 auto;padding:0 var(--gut)}
@media(min-width:1080px){.shell{padding-left:calc(var(--gut) + var(--rail))}}

.plate{position:relative;padding:clamp(84px,13vh,150px) 0}
.plate + .plate{border-top:1px solid var(--line-2)}

/* cabeçalho de chapa */
.ph{display:flex;flex-direction:column;gap:18px;margin-bottom:clamp(38px,5vw,60px)}
.ph__tag{
  font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.2em;
  text-transform:uppercase;color:var(--accent);
  display:flex;align-items:center;gap:12px;
}
.ph__tag::before{content:"";width:26px;height:1px;background:var(--accent);flex:none}
.ph h2{font-size:clamp(2.1rem,6.2vw,4.4rem)}
.ph__sub{color:var(--ink-2);max-width:56ch;font-size:1.02rem}

/* linha de cota */
.dim{display:flex;align-items:center;gap:14px;margin:34px 0;color:var(--ink-3)}
.dim__l{flex:1;height:1px;background:var(--line);position:relative}
.dim__l::before,.dim__l::after{content:"";position:absolute;top:-4px;width:1px;height:9px;background:var(--line)}
.dim__l::before{left:0}.dim__l::after{right:0}
.dim span{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
@media(max-width:680px){
  .dim{flex-wrap:wrap;gap:8px}
  .dim span{white-space:normal}
  .dim__l{flex:1 0 100%;order:3}
}

/* ===================== CARRIL / PROGRESSO ===================== */
#bar{position:fixed;inset:0 auto auto 0;height:2px;width:0;background:var(--accent);z-index:60}
.rail{
  position:fixed;left:26px;top:50%;transform:translateY(-50%);z-index:55;
  display:none;flex-direction:column;gap:0;
}
@media(min-width:1080px){.rail{display:flex}.cue{left:calc(var(--gut) + var(--rail))}}
.rail a{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-decoration:none;
  color:var(--ink-3);padding:7px 0 7px 20px;position:relative;transition:color .35s ease;
}
.rail a::before{
  content:"";position:absolute;left:0;top:50%;width:9px;height:1px;
  background:currentColor;transform:translateY(-50%) scaleX(.45);transform-origin:left;
  transition:transform .35s cubic-bezier(.2,.8,.2,1);
}
.rail a:hover{color:var(--ink-2)}
.rail a[aria-current="true"]{color:var(--accent)}
.rail a[aria-current="true"]::before{transform:translateY(-50%) scaleX(1)}

/* ===================== BOTÕES ===================== */
.btn{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;
  text-decoration:none;border:1px solid var(--line);color:var(--ink);
  padding:13px 22px;background:transparent;cursor:pointer;border-radius:2px;
  position:relative;overflow:hidden;isolation:isolate;
  transition:color .35s ease,border-color .35s ease;
}
.btn::after{
  content:"";position:absolute;inset:0;background:var(--accent);z-index:-1;
  transform:translateY(101%);transition:transform .45s cubic-bezier(.2,.8,.2,1);
}
.btn:hover{color:var(--ground);border-color:var(--accent)}
.btn:hover::after{transform:translateY(0)}
.btn--solid{background:var(--accent);border-color:var(--accent);color:var(--ground)}
.btn--solid::after{background:var(--ink)}
.btn--solid:hover{color:var(--ground);border-color:var(--ink)}

/* ===================== HERO ===================== */
.hero{min-height:100svh;display:flex;align-items:center;position:relative;padding:120px 0 70px;border:0}
#grid{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero__in{position:relative;display:grid;gap:clamp(34px,5vw,60px);grid-template-columns:1fr;align-items:end}
.hero__in > *{min-width:0}
@media(min-width:900px){.hero__in{grid-template-columns:1.45fr .72fr}}

.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--accent);margin-bottom:26px;
}
.name{font-size:clamp(2.9rem,8.6vw,7.6rem);line-height:.86;font-variation-settings:"wdth" 125}
/* a máscara de revelação corta só na vertical: o nome nunca fica truncado */
.name .ln{display:block;overflow:visible;clip-path:inset(-.3em -100vw -.05em -100vw)}
.name .ln > i{display:block;font-style:normal;will-change:transform,filter}
.name .thin{
  -webkit-text-stroke:1.2px var(--accent);color:transparent;
  font-variation-settings:"wdth" 125;
}
.lede{font-size:clamp(1.05rem,1.9vw,1.34rem);color:var(--ink-2);max-width:44ch;margin-top:26px}
.lede b{color:var(--ink);font-weight:600}
.hero__cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}

.portrait{position:relative}
.portrait .fr{
  position:relative;overflow:hidden;border:1px solid var(--line);border-radius:2px;
  aspect-ratio:1/1;background:var(--ground-3);box-shadow:var(--shadow);
}
.portrait img{width:100%;height:100%;object-fit:cover;filter:saturate(.82) contrast(1.04)}
.portrait figcaption{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin-top:12px;display:flex;justify-content:space-between;gap:10px;
}
.cue{
  position:absolute;left:var(--gut);bottom:26px;display:flex;align-items:center;gap:12px;
  font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);
}
.cue i{display:block;width:34px;height:1px;background:var(--ink-3);transform-origin:left;animation:cue 2.4s cubic-bezier(.4,0,.2,1) infinite}
@keyframes cue{0%,100%{transform:scaleX(.2);opacity:.4}50%{transform:scaleX(1);opacity:1}}

/* ===================== NÚMEROS ===================== */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:0}
.fig{padding:26px 22px 24px;border-top:1px solid var(--line);position:relative}
.fig::after{content:"";position:absolute;left:0;top:-1px;height:1px;width:0;background:var(--accent);transition:width 1.1s cubic-bezier(.2,.8,.2,1) .15s}
.fig.on::after{width:100%}
.fig__n{font-family:var(--display);font-variation-settings:"wdth" 110;font-weight:800;
  font-size:clamp(2.1rem,4.4vw,3.2rem);line-height:1;color:var(--accent);
  font-variant-numeric:tabular-nums;margin-bottom:10px}
.fig__l{font-size:14.5px;color:var(--ink-2);line-height:1.42;font-family:var(--serif)}

/* ===================== ARGUMENTO ===================== */
.claim{font-size:clamp(1.6rem,3.9vw,2.9rem);max-width:19ch;margin-bottom:34px}
.body{display:grid;gap:20px;max-width:62ch}
.body p{color:var(--ink-2)}
.lit span{transition:color .5s ease,opacity .5s ease;color:var(--ink-3);opacity:.55}
.lit span.on{color:var(--ink);opacity:1}
.keys{list-style:none;padding:0;margin:38px 0 0;display:grid;gap:0;max-width:70ch}
.keys li{
  display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:baseline;
  padding:20px 0;border-top:1px solid var(--line-2);font-size:1.02rem;
}
.keys li:last-child{border-bottom:1px solid var(--line-2)}
.keys b{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.14em;color:var(--accent)}

/* ===================== PERCURSO ===================== */
.tl{position:relative;padding-left:30px}
.tl__rule{position:absolute;left:4px;top:10px;bottom:10px;width:1px;background:var(--line)}
.tl__rule i{position:absolute;inset:0 auto 0 0;width:1px;height:0;background:var(--accent);display:block}
.job{position:relative;padding:0 0 42px}
.job:last-child{padding-bottom:0}
.job__dot{position:absolute;left:-30px;top:9px;width:9px;height:9px;border-radius:50%;
  background:var(--ground);border:1px solid var(--ink-3);transform:scale(.4);opacity:0;
  transition:transform .5s cubic-bezier(.34,1.56,.64,1),opacity .4s ease}
.job.on .job__dot{transform:scale(1);opacity:1}
.job.job--now .job__dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 16%,transparent)}
.job__hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:4px}
.job__co{font-family:var(--display);font-variation-settings:"wdth" 112;font-weight:800;
  text-transform:uppercase;font-size:1.32rem;letter-spacing:-.005em}
.job__dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.job__rl{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.job__tx{color:var(--ink-2);max-width:64ch;font-size:1.01rem}

/* ===================== TESE ===================== */
.split{display:grid;gap:clamp(30px,4.5vw,56px);grid-template-columns:1fr;align-items:start}
.split > *{min-width:0}
@media(min-width:900px){.split{grid-template-columns:1.08fr .92fr}}
.tese{border:1px solid var(--line);border-radius:2px;padding:26px 24px;background:var(--ground-2);
  margin:26px 0;position:relative;overflow:hidden}
.tese::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);
  transform:scaleY(0);transform-origin:top;transition:transform .8s cubic-bezier(.2,.8,.2,1) .1s}
.tese.on::before{transform:scaleY(1)}
.tese__k{font-family:var(--mono);font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.tese__t{font-family:var(--serif);font-weight:500;font-size:1.06rem;line-height:1.45;margin-bottom:18px}
.tese__b{display:flex;flex-wrap:wrap;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:999px;padding:7px 13px;color:var(--ink-2)}
.shot{overflow:hidden;border:1px solid var(--line);border-radius:2px;aspect-ratio:3/4;background:var(--ground-3)}
.shot img{width:100%;height:100%;object-fit:cover;will-change:transform;filter:saturate(.85)}

/* ===================== PLANO (fixado) ===================== */
.pin{position:relative;padding:0;border-top:1px solid var(--line-2)}
.pin__track{position:relative}
.pin__stage{position:sticky;top:0;min-height:100svh;display:flex;align-items:center;padding:90px 0}
.stage{display:grid;gap:clamp(26px,4vw,60px);grid-template-columns:1fr;align-items:center;width:100%}
.stage > *{min-width:0}
@media(min-width:900px){.stage{grid-template-columns:.85fr 1.15fr}}
.stage__num{position:relative;height:clamp(120px,20vw,240px)}
.stage__num b{
  position:absolute;inset:0;font-family:var(--display);font-variation-settings:"wdth" 125;
  font-weight:900;font-size:clamp(7rem,19vw,15rem);line-height:.8;color:var(--accent);
  opacity:0;transform:translateY(28px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1);
  font-variant-numeric:tabular-nums;
}
.stage__num b.on{opacity:1;transform:none}
.steps{position:relative}
.step{opacity:.24;transition:opacity .5s ease;padding:20px 0;border-top:1px solid var(--line-2)}
.step.on{opacity:1}
.step__d{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:9px}
.step h3{font-size:clamp(1.35rem,2.9vw,2.05rem);margin-bottom:14px}
.step ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.step li{position:relative;padding-left:20px;color:var(--ink-2);font-size:.99rem}
.step li::before{content:"";position:absolute;left:0;top:.72em;width:9px;height:1px;background:var(--accent)}
.pin__bar{height:1px;background:var(--line);margin-top:30px;position:relative}
.pin__bar i{position:absolute;left:0;top:0;height:1px;width:0;background:var(--accent);display:block}

/* ===================== PROVA ===================== */
.proof{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(252px,1fr))}
.pcard{
  border:1px solid var(--line);border-radius:2px;padding:28px 24px;background:var(--ground-2);
  text-decoration:none;display:block;position:relative;overflow:hidden;
  transform-style:preserve-3d;transition:border-color .35s ease;
}
.pcard:hover{border-color:var(--accent)}
.pcard__k{font-family:var(--display);font-variation-settings:"wdth" 108;font-weight:800;
  font-size:2.15rem;line-height:1;color:var(--accent);margin-bottom:12px;font-variant-numeric:tabular-nums}
.pcard p{color:var(--ink-2);font-size:.98rem}
.pcard__go{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--accent);margin-top:16px;display:inline-block}

/* ===================== GALERIA ===================== */
.gal{display:grid;gap:12px;grid-template-columns:1fr}
/* o recorte vive nos filhos: um alvo totalmente recortado tem área de
   interseção nula e o IntersectionObserver nunca dispararia */
.gal figure{margin:0;position:relative;overflow:hidden;border:1px solid var(--line);
  border-radius:2px;background:var(--ground-3);aspect-ratio:4/3;
  clip-path:inset(0 0 100% 0);transition:clip-path 1.05s cubic-bezier(.16,1,.3,1)}
.gal.on figure{clip-path:inset(0 0 0 0)}
.gal.on figure:nth-child(2){transition-delay:.13s}
.gal.on figure:nth-child(3){transition-delay:.26s}
.gal .tall{aspect-ratio:3/4}
.gal img{width:100%;height:100%;object-fit:cover;will-change:transform;filter:saturate(.86)}
.gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 13px 10px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;line-height:1.4;color:#F6F2E9;
  background:linear-gradient(transparent,rgba(10,9,7,.86))}
@media(min-width:620px){
  .gal{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:4/3.2}
  .gal figure,.gal .tall{aspect-ratio:auto;min-height:0}
  .gal .tall{grid-row:1/3}
}

/* ===================== CONTACTO ===================== */
.end{text-align:left}
.end h2{font-size:clamp(2.6rem,9vw,6.2rem)}
.mail{font-family:var(--display);font-variation-settings:"wdth" 105;font-weight:800;
  text-transform:uppercase;font-size:clamp(1.05rem,3.3vw,2.1rem);text-decoration:none;
  color:var(--accent);display:inline-block;margin:26px 0 4px;position:relative;word-break:break-all}
.mail::after{content:"";position:absolute;left:0;bottom:-3px;height:1.5px;width:100%;background:var(--accent);
  transform:scaleX(0);transform-origin:right;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.mail:hover::after{transform:scaleX(1);transform-origin:left}
.ends{display:flex;flex-wrap:wrap;gap:11px;margin-top:30px}
.foot{margin-top:64px;padding-top:22px;border-top:1px solid var(--line-2);
  display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}

/* ===================== REVEAL ===================== */
.rv{opacity:0;transform:translateY(22px);transition:opacity .85s cubic-bezier(.16,1,.3,1),transform .85s cubic-bezier(.16,1,.3,1)}
.rv.on{opacity:1;transform:none}
.rv[data-d="1"]{transition-delay:.08s}
.rv[data-d="2"]{transition-delay:.16s}
.rv[data-d="3"]{transition-delay:.24s}

/* cursor */
#ring{position:fixed;top:0;left:0;width:26px;height:26px;border:1px solid var(--accent);
  border-radius:50%;pointer-events:none;z-index:70;opacity:0;transform:translate(-120px,-120px);
  transition:opacity .3s ease,width .28s ease,height .28s ease,background .28s ease;mix-blend-mode:difference}
@media (pointer:coarse){#ring{display:none}}

@media (prefers-reduced-motion: reduce){
  .rv,.gal figure,.gal.on figure,.step,.stage__num b,.job__dot,.tese::before{
    opacity:1!important;transform:none!important;clip-path:none!important;transition:none!important}
  .cue i{animation:none}
  .lit span{color:var(--ink)!important;opacity:1!important}
  html{scroll-behavior:auto}
}

/* ===================== BARRA DE TOPO ===================== */
.top{
  position:fixed;top:0;left:0;right:0;z-index:58;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:13px var(--gut);
  background:transparent;border-bottom:1px solid transparent;
  transition:background .35s ease,border-color .35s ease,backdrop-filter .35s ease;
}
.top.solid{background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(12px);border-bottom-color:var(--line-2)}
.top__id{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top__id b{color:var(--ink-2);font-weight:400}
.top__r{display:flex;align-items:center;gap:9px}
.langs{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.langs button{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;background:transparent;border:0;
  color:var(--ink-3);cursor:pointer;padding:7px 11px;transition:background .25s ease,color .25s ease;
}
.langs button:hover{color:var(--ink)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--ground)}
@media(max-width:700px){.top__id{display:none}}

/* ===================== FERRAMENTAS ===================== */
.tools{display:flex;flex-wrap:wrap;gap:9px}
.tool{border:1px solid var(--line);border-radius:2px;padding:11px 16px;font-size:14.5px;
  font-family:var(--serif);color:var(--ink-2);transition:border-color .3s ease,color .3s ease}
.tool:hover{border-color:var(--accent);color:var(--ink)}

/* ===================== SELETOR DE PREVIEW (só no build único) ===================== */
.pick{position:fixed;right:16px;bottom:16px;z-index:59;display:flex;flex-direction:column;gap:8px;
  background:color-mix(in srgb,var(--ground-2) 94%,transparent);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:3px;padding:12px;box-shadow:var(--shadow);max-width:min(88vw,340px)}
.pick__l{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.pick__row{display:flex;flex-wrap:wrap;gap:6px}
.pick button{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--line);background:transparent;color:var(--ink-2);
  padding:7px 11px;border-radius:2px;cursor:pointer;transition:.25s;
}
.pick button:hover{border-color:var(--accent);color:var(--ink)}
.pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ground)}

/* ===================== IMPRESSÃO ===================== */
@media print{
  :root,:root[data-theme="dark"]{
    --ground:#fff;--ground-2:#fff;--ground-3:#fff;--ink:#000;--ink-2:#333;--ink-3:#666;
    --accent:#6B4508;--line:#ccc;--line-2:#e2e2e2;--shadow:none;
  }
  body{background:#fff;color:#000;font-size:10.5pt}
  .top,.rail,#bar,#ring,.cue,.pick,#grid,.hero__cta{display:none!important}
  .plate{padding:16pt 0;break-inside:avoid}
  .shell{padding-left:var(--gut)!important;max-width:none}
  .hero{min-height:auto;padding:0 0 14pt}
  .name{font-size:30pt}
  .name .thin{-webkit-text-stroke:0;color:#000}
  .rv,.gal figure,.step,.stage__num b,.job__dot,.tese::before{
    opacity:1!important;transform:none!important;clip-path:none!important}
  .lit span{color:#000!important;opacity:1!important}
  .step{opacity:1!important}
  .pin__stage{position:static;min-height:0;padding:0}
  .stage__num{display:none}
  .stage{grid-template-columns:1fr}
  .stage__num b{position:static;opacity:1}
  .gal{aspect-ratio:auto;grid-template-columns:1fr 1fr}
  .gal .tall{grid-row:auto}
  .gal figure,.gal .tall{aspect-ratio:4/3}
  a{text-decoration:none}
}

<script>
/* =========================================================================
   main.js — render das chapas, idioma, empresa e sistema de animação.
   Conteúdo em data.js; textos da interface em i18n.js.
   ========================================================================= */
(function(){
"use strict";

var LANGS = ["pt","en","es"];
var params = new URLSearchParams(location.search);
var RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var FINE = window.matchMedia("(pointer:fine)").matches;

var $  = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
var clamp = function(v,a,b){ return v<a?a:(v>b?b:v); };
var esc = function(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
};

/* ---------- empresa e idioma ---------- */
var empresaKey = (params.get("e") || "default").toLowerCase();
var EMPRESA = EMPRESAS[empresaKey] || EMPRESAS.default;

function idiomaInicial(){
  var q = (params.get("lang")||"").toLowerCase();
  if (LANGS.indexOf(q) >= 0) return q;
  try { var g = localStorage.getItem("gr_lang"); if (LANGS.indexOf(g) >= 0) return g; } catch(e){}
  return "pt"; // os links vão para empresas portuguesas: arranca sempre em PT
}
var lang = idiomaInicial();

function marca(){
  var r = document.documentElement.style;
  r.setProperty("--accent", EMPRESA.accent);
  r.setProperty("--accent-hi", EMPRESA.accent2);
}
var comEmpresa = function(t){ return String(t).replace(/\{empresa\}/g, EMPRESA.nome); };

/* =========================================================================
   RENDER
   ========================================================================= */
var PLATES = ["capa","ficha","argumento","percurso","padel","plano","prova","ferramentas","fora","contacto"];

function num(i){ return (i<10?"0":"") + i; }

function cabeca(i, key, titulo, sub){
  var t = I18N[lang];
  return '<div class="ph rv">'
    + '<div class="ph__tag" data-scramble>' + esc(t.chapa) + " " + num(i) + " — " + esc(t.plates[key]) + '</div>'
    + '<h2>' + esc(titulo) + '</h2>'
    + (sub ? '<p class="ph__sub">' + esc(sub) + '</p>' : '')
    + '</div>';
}

function render(){
  var t = I18N[lang], p = EMPRESA.pitch[lang], plano = EMPRESA.plano[lang];
  var assunto = encodeURIComponent(t.candidatura + " — " + PROFILE.nome + " — " + EMPRESA.nome);
  var mailto = "mailto:" + PROFILE.email + "?subject=" + assunto;

  document.documentElement.lang = t.htmlLang;
  document.title = PROFILE.nome + " — " + t.candidatura + " " + EMPRESA.nomeCurto;

  $("#topId").innerHTML = "<b>" + esc(PROFILE.nome) + "</b> · " + esc(t.candidatura) + " " + esc(EMPRESA.nomeCurto);
  var cta = $("#topCta"); cta.textContent = t.hero_cta_falar; cta.href = mailto;
  $$("#langs button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.lang === lang)); });

  $("#rail").innerHTML = PLATES.map(function(k,i){
    return '<a href="#p' + i + '" data-r="p' + i + '">' + num(i) + " · " + esc(t.plates[k]).toUpperCase() + '</a>';
  }).join("");

  var H = [];

  /* ---- 00 capa ---- */
  H.push('<section class="plate hero" id="p0">'
    + '<canvas id="grid" aria-hidden="true"></canvas>'
    + '<div class="shell hero__in">'
      + '<div>'
        + '<div class="eyebrow rv">' + esc(comEmpresa(t.hero_kicker)) + '</div>'
        + '<h1 class="name"><span class="ln"><i>Gonçalo</i></span><span class="ln"><i class="thin">Ribeiro</i></span></h1>'
        + '<p class="lede rv" data-d="2">' + esc(t.hero_role) + '</p>'
        + '<div class="hero__cta rv" data-d="3">'
          + '<a class="btn btn--solid" id="magnet" href="' + mailto + '">' + esc(t.hero_cta_falar) + '</a>'
          + '<a class="btn" href="#p2">' + esc(comEmpresa(t.sec_why)) + '</a>'
        + '</div>'
      + '</div>'
      + '<figure class="portrait rv" data-d="1" style="margin:0">'
        + '<div class="fr"><img src="' + esc(PROFILE.foto) + '" alt="' + esc(PROFILE.nome) + '"></div>'
        + '<figcaption><span>' + esc(t.hero_meta_local) + '</span><span>' + esc(t.hero_meta_idade) + '</span></figcaption>'
      + '</figure>'
    + '</div>'
    + '<div class="shell"><div class="cue"><i></i> ' + esc(t.rolar) + '</div></div>'
  + '</section>');

  /* ---- 01 ficha ---- */
  H.push('<section class="plate" id="p1"><div class="shell">'
    + cabeca(1, "ficha", t.sec_ficha, t.sec_ficha_sub)
    + '<div class="figs">'
    + STATS.map(function(s){
        return '<div class="fig"><div class="fig__n" data-to="' + s.valor + '" data-suf="' + s.sufixo
             + '" data-raw="' + (s.raw?1:0) + '">0</div><div class="fig__l">' + esc(t[s.chave]) + '</div></div>';
      }).join("")
    + '</div>'
    + '<div class="dim"><span>' + esc(t.hero_meta_local) + '</span><i class="dim__l"></i><span>' + esc(t.hero_meta_desloc) + '</span></div>'
  + '</div></section>');

  /* ---- 02 argumento (o 1.º parágrafo acende palavra a palavra) ---- */
  H.push('<section class="plate" id="p2"><div class="shell">'
    + cabeca(2, "argumento", comEmpresa(t.sec_why), comEmpresa(t.sec_why_sub))
    + '<h3 class="claim rv">' + esc(p.titulo) + '</h3>'
    + '<div class="body">'
    + p.paras.map(function(x,i){
        return i === 0 ? '<p class="lit" data-lit>' + esc(x) + '</p>'
                       : '<p class="rv"' + (i>1?' data-d="1"':'') + '>' + esc(x) + '</p>';
      }).join("")
    + '</div>'
    + '<ul class="keys">'
    + p.bullets.map(function(b,i){
        return '<li class="rv" data-d="' + i + '"><b>' + num(i+1) + '</b><span>' + esc(b) + '</span></li>';
      }).join("")
    + '</ul>'
  + '</div></section>');

  /* ---- 03 percurso ---- */
  H.push('<section class="plate" id="p3"><div class="shell">'
    + cabeca(3, "percurso", t.sec_percurso, t.sec_percurso_sub)
    + '<div class="tl"><div class="tl__rule"><i></i></div>'
    + PERCURSO.map(function(j){
        var quando = j.periodo + (j.periodoFim ? j.periodoFim[lang] : "");
        return '<article class="job' + (j.destaque ? " job--now" : "") + '">'
          + '<span class="job__dot"></span>'
          + '<div class="job__hd"><span class="job__co">' + esc(j.empresa) + '</span>'
          + '<span class="job__dt">' + esc(quando) + '</span></div>'
          + '<div class="job__rl">' + esc(j.cargo[lang]) + ' · ' + esc(j.local) + '</div>'
          + '<p class="job__tx">' + esc(j.desc[lang]) + '</p>'
        + '</article>';
      }).join("")
    + '</div>'
  + '</div></section>');

  /* ---- 04 padel ---- */
  var tese = PROFILE.teseTitulo ? ('<div class="tese">'
      + '<div class="tese__k">' + esc(t.padel_tese_kicker) + '</div>'
      + '<p class="tese__t">“' + esc(PROFILE.teseTitulo) + '”</p>'
      + '<div class="tese__b">'
        + (PROFILE.teseUrl ? '<a class="btn" href="' + esc(PROFILE.teseUrl) + '" target="_blank" rel="noopener">' + esc(t.padel_tese) + '</a>' : "")
        + (PROFILE.tesePdf ? '<a class="btn" href="' + esc(PROFILE.tesePdf) + '" target="_blank" rel="noopener">' + esc(t.padel_tese_pdf) + '</a>' : "")
      + '</div></div>') : "";

  H.push('<section class="plate" id="p4"><div class="shell">'
    + cabeca(4, "padel", t.sec_padel)
    + '<div class="split"><div>'
      + '<div class="body" style="max-width:60ch">'
        + '<p class="rv">' + esc(t.padel_p1) + '</p>'
        + '<p class="rv" data-d="1">' + esc(t.padel_p2) + '</p>'
      + '</div>'
      + tese
      + '<div class="body" style="max-width:60ch"><p class="rv">' + esc(t.padel_dados) + '</p>'
      + '<p class="rv" data-d="1">' + esc(t.padel_p3) + '</p></div>'
      + '<div class="chips"><span class="chip">' + esc(t.padel_badge_1) + '</span>'
      + '<span class="chip">' + esc(t.padel_badge_2) + '</span>'
      + '<span class="chip">' + esc(t.padel_badge_3) + '</span></div>'
    + '</div>'
    + '<div class="shot rv" data-d="1"><img src="' + esc(PROFILE.fotoPadel) + '" alt="' + esc(t.sec_padel) + '" data-par="0.06"></div>'
    + '</div>'
  + '</div></section>');

  /* ---- 05 plano (chapa fixada) ---- */
  H.push('<section class="pin" id="p5"><div class="pin__track" id="track"><div class="pin__stage">'
    + '<div class="shell" style="width:100%">'
      + '<div class="ph" style="margin-bottom:32px">'
        + '<div class="ph__tag" data-scramble>' + esc(t.chapa) + ' 05 — ' + esc(t.plates.plano) + '</div>'
        + '<h2 style="font-size:clamp(1.8rem,4.2vw,3rem)">' + esc(comEmpresa(t.sec_plano_h2)) + '</h2>'
      + '</div>'
      + '<div class="stage">'
        + '<div class="stage__num" id="nums">'
        + plano.map(function(_,i){ return '<b data-i="' + i + '">' + num(i+1) + '</b>'; }).join("")
        + '</div>'
        + '<div class="steps" id="steps">'
        + plano.map(function(f,i){
            return '<div class="step" data-i="' + i + '">'
              + '<div class="step__d">' + esc(f.f) + '</div><h3>' + esc(f.t) + '</h3>'
              + '<ul>' + f.i.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") + '</ul>'
            + '</div>';
          }).join("")
        + '</div>'
      + '</div>'
      + '<div class="pin__bar"><i id="pinbar"></i></div>'
    + '</div>'
  + '</div></div></section>');

  /* ---- 06 prova ---- */
  H.push('<section class="plate" id="p6"><div class="shell">'
    + cabeca(6, "prova", t.sec_prova, t.sec_prova_sub)
    + '<div class="proof">'
    + PROVA.map(function(x,i){
        var dentro = '<div class="pcard__k">' + esc(x.kpi) + '</div><p>' + esc(t[x.chave]) + '</p>'
                   + (x.link ? '<span class="pcard__go">' + esc(t.prova_ver) + ' →</span>' : "");
        var attrs = 'class="pcard rv" data-d="' + i + '" data-tilt';
        return x.link ? '<a ' + attrs + ' href="' + x.link + '" target="_blank" rel="noopener">' + dentro + '</a>'
                      : '<div ' + attrs + '>' + dentro + '</div>';
      }).join("")
    + '</div>'
  + '</div></section>');

  /* ---- 07 ferramentas ---- */
  H.push('<section class="plate" id="p7"><div class="shell">'
    + cabeca(7, "ferramentas", t.sec_tools)
    + '<div class="tools rv">' + FERRAMENTAS.map(function(f){ return '<span class="tool">' + esc(f) + '</span>'; }).join("") + '</div>'
  + '</div></section>');

  /* ---- 08 fora do campo ---- */
  H.push('<section class="plate" id="p8"><div class="shell">'
    + cabeca(8, "fora", t.sec_off_h2)
    + '<div class="split">'
      + '<div class="gal">'
      + GALERIA.map(function(g,i){
          return '<figure' + (i === 0 ? ' class="tall"' : '') + '>'
            + '<img src="' + esc(g.src) + '" alt="' + esc(t[g.chave]) + '" data-par="0.05">'
            + '<figcaption>' + esc(t[g.chave]) + '</figcaption></figure>';
        }).join("")
      + '</div>'
      + '<div class="body" style="max-width:52ch">'
        + '<p class="rv">' + esc(t.off_p1) + '</p>'
        + '<p class="rv" data-d="1">' + esc(t.off_p2) + '</p>'
        + '<p class="rv" data-d="2">' + esc(t.off_p3) + '</p>'
      + '</div>'
    + '</div>'
  + '</div></section>');

  /* ---- 09 contacto ---- */
  H.push('<section class="plate end" id="p9"><div class="shell">'
    + cabeca(9, "contacto", t.sec_contacto, t.contacto_p)
    + '<a class="mail" href="' + mailto + '">' + esc(PROFILE.email) + '</a>'
    + '<div class="ends">'
      + '<a class="btn btn--solid" href="https://wa.me/' + PROFILE.telefoneRaw + '" target="_blank" rel="noopener">' + esc(t.contacto_wpp) + ' · ' + esc(PROFILE.telefone) + '</a>'
      + '<a class="btn" href="' + PROFILE.linkedin + '" target="_blank" rel="noopener">LinkedIn</a>'
      + '<a class="btn" href="' + PROFILE.instagramAcademia + '" target="_blank" rel="noopener">' + esc(t.contacto_ig) + '</a>'
      + '<button class="btn" id="pdf">' + esc(t.hero_cta_pdf) + '</button>'
    + '</div>'
    + '<div class="foot"><span>' + esc(comEmpresa(t.footer_feito)) + '</span><span>' + esc(t.footer_ano) + '</span></div>'
  + '</div></section>');

  $("#main").innerHTML = H.join("");
  $("#pdf").addEventListener("click", function(){ window.print(); });
  motor();
}

/* =========================================================================
   MOTOR DE ANIMAÇÃO
   ========================================================================= */
var ios = [];      // observadores do render actual
var refs = {};     // referências recalculadas a cada render
var loopOn = false;

function motor(){
  ios.forEach(function(o){ o.disconnect(); });
  ios = [];

  /* --- entrada das chapas.
     O recorte da galeria vive nos filhos: um alvo totalmente recortado tem
     área de interseção nula e o observador nunca dispararia. --- */
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(!e.isIntersecting) return;
      e.target.classList.add("on");
      io.unobserve(e.target);
    });
  },{ threshold:.15, rootMargin:"0px 0px -8% 0px" });
  $$(".rv, .fig, .job, .tese, .gal").forEach(function(el){ io.observe(el); });
  ios.push(io);

  /* --- nome a subir por trás da máscara --- */
  if(!RM){
    $$(".name .ln > i").forEach(function(el,i){
      el.style.transform = "translateY(102%)"; el.style.filter = "blur(7px)"; el.style.opacity = "0";
      setTimeout(function(){
        el.style.transition = "transform 1.15s cubic-bezier(.16,1,.3,1), filter .95s ease, opacity .8s ease";
        el.style.transform = "none"; el.style.filter = "none"; el.style.opacity = "1";
      }, 130 + i*135);
    });
    setTimeout(function(){ $$(".hero .rv").forEach(function(el){ el.classList.add("on"); }); }, 320);
  } else {
    $$(".hero .rv").forEach(function(el){ el.classList.add("on"); });
  }

  /* --- contadores --- */
  var ioN = new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(!e.isIntersecting) return;
      ioN.unobserve(e.target);
      var el = e.target, to = +el.dataset.to, suf = el.dataset.suf || "", raw = el.dataset.raw === "1";
      var fmt = function(v){ return raw ? String(v) : v.toLocaleString("pt-PT"); };
      if(RM){ el.textContent = fmt(to) + suf; return; }
      var st = performance.now();
      (function tick(n){
        var k = clamp((n-st)/1500, 0, 1), e2 = 1 - Math.pow(1-k, 4);
        el.textContent = fmt(Math.round(to*e2)) + (k===1 ? suf : "");
        if(k<1) requestAnimationFrame(tick);
      })(st);
    });
  },{ threshold:.6 });
  $$(".fig__n").forEach(function(el){ ioN.observe(el); });
  ios.push(ioN);

  /* --- parágrafo que acende palavra a palavra --- */
  refs.lit = $$("[data-lit]").map(function(p){
    var words = p.textContent.trim().split(/\s+/);
    p.textContent = "";
    var spans = words.map(function(w,i){
      var s = document.createElement("span");
      s.textContent = w + (i < words.length-1 ? " " : "");
      p.appendChild(s); return s;
    });
    return { el:p, spans:spans, n:-1 };
  });

  /* --- etiquetas que calibram --- */
  var CH = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/·—";
  var ioS = new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(!e.isIntersecting) return;
      ioS.unobserve(e.target);
      if(RM) return;
      var el = e.target, real = el.textContent, len = real.length, f = 0;
      var id = setInterval(function(){
        f++;
        var lock = Math.floor(len * (f/16)), out = "";
        for(var i=0;i<len;i++){
          var c = real[i];
          out += (i < lock || c === " " || c === "·" || c === "—") ? c : CH[(Math.random()*CH.length)|0];
        }
        el.textContent = out;
        if(f >= 16){ clearInterval(id); el.textContent = real; }
      }, 26);
    });
  },{ threshold:.9 });
  $$("[data-scramble]").forEach(function(el){ ioS.observe(el); });
  ios.push(ioS);

  /* --- botão magnético --- */
  var mag = $("#magnet");
  if(mag && FINE && !RM){
    mag.addEventListener("pointermove", function(e){
      var r = mag.getBoundingClientRect();
      mag.style.transform = "translate(" + ((e.clientX-r.left-r.width/2)*.28) + "px," + ((e.clientY-r.top-r.height/2)*.34) + "px)";
    });
    mag.addEventListener("pointerleave", function(){
      mag.style.transition = "transform .5s cubic-bezier(.34,1.56,.64,1)";
      mag.style.transform = "none";
      setTimeout(function(){ mag.style.transition = ""; }, 500);
    });
  }

  /* --- inclinação dos cartões --- */
  if(FINE && !RM){
    $$("[data-tilt]").forEach(function(c){
      c.addEventListener("pointermove", function(e){
        var r = c.getBoundingClientRect();
        var mx = (e.clientX-r.left)/r.width - .5, my = (e.clientY-r.top)/r.height - .5;
        c.style.transform = "perspective(900px) rotateY(" + (mx*5.5) + "deg) rotateX(" + (-my*5.5) + "deg) translateY(-3px)";
      });
      c.addEventListener("pointerleave", function(){
        c.style.transition = "transform .55s cubic-bezier(.2,.8,.2,1)";
        c.style.transform = "";
        setTimeout(function(){ c.style.transition = "transform .55s cubic-bezier(.2,.8,.2,1), border-color .35s ease"; }, 550);
      });
    });
  }

  /* --- referências do laço de scroll --- */
  refs.rails  = $$("#rail a");
  refs.plates = refs.rails.map(function(a){ return document.getElementById(a.dataset.r); });
  refs.rule   = $(".tl__rule i");
  refs.track  = $("#track");
  refs.steps  = $$("#steps .step");
  refs.nums   = $$("#nums b");
  refs.pinbar = $("#pinbar");
  refs.pars   = $$("[data-par]");
  refs.phase  = -1;
  refs.steps.forEach(function(s){ s.classList.toggle("on", s.dataset.i === "0"); });
  refs.nums.forEach(function(b){ b.classList.toggle("on", b.dataset.i === "0"); });

  grelha();
  if(!loopOn){ loopOn = true; requestAnimationFrame(frame); }
}

/* ---------- face perfurada da pala, na capa ---------- */
var G = { dots:[], px:-999, py:-999, tx:-999, ty:-999, t0:0 };
function cores(){
  var cs = getComputedStyle(document.documentElement);
  G.dot = cs.getPropertyValue("--dot").trim() || "rgba(0,0,0,.25)";
  G.acc = cs.getPropertyValue("--accent").trim();
}
function construir(){
  if(!G.cv) return;
  var r = G.hero.getBoundingClientRect(), DPR = Math.min(2, window.devicePixelRatio||1);
  G.cv.width = r.width*DPR; G.cv.height = r.height*DPR;
  G.cv.style.width = r.width+"px"; G.cv.style.height = r.height+"px";
  G.cx.setTransform(DPR,0,0,DPR,0,0);
  G.dots = [];
  var gap = r.width < 700 ? 30 : 34;
  for(var y=gap/2; y<r.height; y+=gap)
    for(var x=gap/2; x<r.width; x+=gap) G.dots.push([x,y]);
}
function grelha(){
  G.cv = $("#grid"); G.hero = $("#p0");
  if(!G.cv) return;
  G.cx = G.cv.getContext("2d");
  G.t0 = performance.now();
  cores(); construir();
  if(RM){
    G.cx.fillStyle = G.dot; G.cx.globalAlpha = .45;
    G.dots.forEach(function(d){ G.cx.beginPath(); G.cx.arc(d[0],d[1],1,0,6.2832); G.cx.fill(); });
    return;
  }
  G.hero.addEventListener("pointermove", function(e){
    var r = G.hero.getBoundingClientRect();
    G.tx = e.clientX-r.left; G.ty = e.clientY-r.top;
    if(G.px < -500){ G.px = G.tx; G.py = G.ty; }
  });
  G.hero.addEventListener("pointerleave", function(){ G.tx = -999; G.ty = -999; G.t0 = performance.now(); });
}
function pintar(now){
  if(RM || !G.cv || !G.cv.isConnected) return;
  var r = G.hero.getBoundingClientRect();
  if(r.bottom < 0) return;
  G.px += (G.tx-G.px)*.085; G.py += (G.ty-G.py)*.085;
  var vx = G.px, vy = G.py;
  if(G.tx < -500){ // sem rato: um ponto virtual que respira sozinho
    var s = (now-G.t0)/1000;
    vx = r.width*(0.5 + 0.34*Math.cos(s*0.42));
    vy = r.height*(0.5 + 0.30*Math.sin(s*0.31));
  }
  G.cx.clearRect(0,0,r.width,r.height);
  var R = Math.min(r.width,r.height)*0.42;
  for(var i=0;i<G.dots.length;i++){
    var dx = G.dots[i][0]-vx, dy = G.dots[i][1]-vy;
    var k = clamp(1 - Math.sqrt(dx*dx+dy*dy)/R, 0, 1);
    G.cx.beginPath();
    G.cx.arc(G.dots[i][0], G.dots[i][1], 0.85 + k*k*2.5, 0, 6.2832);
    G.cx.fillStyle = k > .34 ? G.acc : G.dot;
    G.cx.globalAlpha = k > .34 ? (0.18 + k*0.62) : 0.5;
    G.cx.fill();
  }
  G.cx.globalAlpha = 1;
}

/* ---------- laço único de scroll ---------- */
function frame(now){
  var vh = window.innerHeight, doc = document.documentElement;
  var max = doc.scrollHeight - vh, sy = window.scrollY || doc.scrollTop;

  $("#bar").style.width = (max>0 ? (sy/max)*100 : 0) + "%";
  $("#top").classList.toggle("solid", sy > 40);

  var cur = 0, i;
  for(i=0;i<refs.plates.length;i++)
    if(refs.plates[i] && refs.plates[i].getBoundingClientRect().top <= vh*0.42) cur = i;
  for(i=0;i<refs.rails.length;i++)
    refs.rails[i].setAttribute("aria-current", i === cur ? "true" : "false");

  if(refs.rule){
    var tl = refs.rule.parentNode.getBoundingClientRect();
    refs.rule.style.height = (clamp((vh*0.78 - tl.top)/(tl.height + vh*0.18), 0, 1)*100) + "%";
  }

  if(!RM){
    refs.lit.forEach(function(o){
      var r = o.el.getBoundingClientRect();
      var n = Math.round(clamp((vh*0.86 - r.top)/(r.height + vh*0.30), 0, 1) * o.spans.length);
      if(n === o.n) return;
      if(n > o.n){ for(var i=o.n+1;i<=n && i<o.spans.length;i++) if(o.spans[i]) o.spans[i].classList.add("on"); }
      else { for(var j=o.n;j>n;j--) if(o.spans[j]) o.spans[j].classList.remove("on"); }
      o.n = n;
    });
    refs.pars.forEach(function(im){
      var r = im.getBoundingClientRect();
      if(r.bottom < -200 || r.top > vh+200) return;
      var c = (r.top + r.height/2 - vh/2)/vh;
      im.style.transform = "scale(1.14) translateY(" + (c * -parseFloat(im.dataset.par) * 100) + "px)";
    });
  }

  if(refs.track){
    var tr = refs.track.getBoundingClientRect(), span = refs.track.offsetHeight - vh;
    var kp = clamp((-tr.top)/(span>0?span:1), 0, 1);
    if(refs.pinbar) refs.pinbar.style.width = (kp*100) + "%";
    var ph = kp >= .70 ? 2 : (kp >= .35 ? 1 : 0);
    if(ph !== refs.phase){
      refs.phase = ph;
      refs.steps.forEach(function(s){ s.classList.toggle("on", +s.dataset.i === ph); });
      refs.nums.forEach(function(b){ b.classList.toggle("on", +b.dataset.i === ph); });
    }
  }

  pintar(now);
  requestAnimationFrame(frame);
}

/* ---------- cursor ---------- */
function cursor(){
  var ring = $("#ring");
  if(!FINE || RM) return;
  var rx=0, ry=0, tx=0, ty=0, on=false;
  window.addEventListener("pointermove", function(e){
    tx = e.clientX; ty = e.clientY;
    if(!on){ rx=tx; ry=ty; on=true; ring.style.opacity=".85"; }
  });
  document.addEventListener("pointerover", function(e){
    if(e.target.closest("a, button, [data-tilt]")){ ring.style.width="46px"; ring.style.height="46px"; }
  });
  document.addEventListener("pointerout", function(e){
    if(e.target.closest("a, button, [data-tilt]")){ ring.style.width="26px"; ring.style.height="26px"; }
  });
  (function loop(){
    rx += (tx-rx)*.19; ry += (ty-ry)*.19;
    ring.style.transform = "translate(" + (rx-ring.offsetWidth/2) + "px," + (ry-ring.offsetHeight/2) + "px)";
    requestAnimationFrame(loop);
  })();
}

/* =========================================================================
   ARRANQUE
   ========================================================================= */
function trocarIdioma(novo){
  if(LANGS.indexOf(novo) < 0 || novo === lang) return;
  lang = novo;
  try { localStorage.setItem("gr_lang", lang); } catch(e){}
  var y = window.scrollY;
  render();
  requestAnimationFrame(function(){ window.scrollTo({ top:y, behavior:"instant" }); });
}

/* API para o build de ficheiro único (seletor de empresa no preview) */
window.__cv = {
  empresas: function(){ return Object.keys(EMPRESAS); },
  actual: function(){ return { empresa:empresaKey, lang:lang }; },
  setEmpresa: function(k){
    if(!EMPRESAS[k]) return;
    empresaKey = k; EMPRESA = EMPRESAS[k]; marca();
    window.scrollTo({ top:0, behavior:"instant" });
    render();
  },
  setLang: trocarIdioma
};

document.addEventListener("DOMContentLoaded", function(){
  marca();
  cursor();
  $("#langs").addEventListener("click", function(e){
    var b = e.target.closest("button[data-lang]");
    if(b) trocarIdioma(b.dataset.lang);
  });
  window.addEventListener("resize", construir);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){
    setTimeout(cores, 60);
  });
  render();
});
})();
